name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fiscal-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate calculations and reading profiles
        run: node --test tests/management_math.test.cjs tests/profile_readings.test.cjs tests/budget_execution.test.cjs
      - name: Validate TOP traceability
        run: python scripts_validate_top_traceability.py
      - name: Validate national claims data
        run: python scripts_validate_reclamos_nacion.py
