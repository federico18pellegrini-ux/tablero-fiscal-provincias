name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fiscal-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Install report dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate calculations and reading profiles
        run: node --test tests/management_math.test.cjs tests/profile_readings.test.cjs tests/budget_execution.test.cjs tests/analytics.test.cjs tests/municipal_dashboard.test.mjs tests/municipal_reports.test.mjs tests/nation_claims.test.cjs tests/national_budget.test.cjs tests/national_report.test.cjs tests/national_management.test.cjs tests/national_decisions.test.cjs tests/national_priorities.test.cjs
      - name: Validate TOP traceability
        run: python scripts_validate_top_traceability.py
      - name: Validate national claims data
        run: python scripts_validate_reclamos_nacion.py
      - name: Verify reports match dashboard data
        run: python scripts_export_management_reports.py --check
      - name: Verify complete municipal reports match dashboard data
        run: python scripts_export_municipal_reports.py --check
      - name: Verify national management inputs and totals
        run: python scripts_build_national_management.py --check
      - name: Verify national policy links and financing
        run: python scripts_build_national_decisions.py --check
      - name: Verify original amendment annexes and program attribution
        run: python scripts_build_national_acts.py --check
      - name: Verify revenue originals and BCRA separation
        run: python scripts_build_national_revenue.py --check
      - name: Verify national reports match dashboard data
        run: python scripts_export_national_reports.py --check
      - name: Verify municipal coverage and deflator
        run: python scripts_build_municipal_tools.py --check
      - name: Verify monthly benefit sources and observed inflation
        run: python scripts_build_national_benefits.py --check
