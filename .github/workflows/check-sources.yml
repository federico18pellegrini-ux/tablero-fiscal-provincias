name: Revisar fuentes de gestión
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar disponibilidad y cambios sin modificar datos
        run: python scripts_check_management_sources.py --output source-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: revision-de-fuentes
          path: source-review.json
